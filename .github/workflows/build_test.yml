name: Build Test

on:
  workflow_dispatch:

env:
  LATEST_TAG: test

jobs:
  build:
    name: Build Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - name: Test build
        run: |
          go mod tidy
          go build -v ./cmd/apimain.go
